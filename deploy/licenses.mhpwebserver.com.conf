# deploy/licenses.mhpwebserver.com.conf  →  /etc/nginx/sites-available/
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name licenses.mhpwebserver.com;

    ssl_certificate     /etc/letsencrypt/live/mhpwebserver.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mhpwebserver.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/robots-noindex.conf;

    client_max_body_size 12m;

    location / {
        include /etc/nginx/snippets/noindex.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8797;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90;
    }
}
